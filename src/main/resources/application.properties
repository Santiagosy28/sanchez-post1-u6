spring.application.name=pedidos-service

# H2 — base de datos embebida en memoria
# MODE=LEGACY restaura la funcion CALL IDENTITY() usada por el codigo dado,
# removida en H2 2.x.
spring.datasource.url=jdbc:h2:mem:pedidos;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Pool de una sola conexion: el codigo usa "CALL IDENTITY()" (funcion de sesion
# de H2) justo despues del INSERT; mantener una unica conexion garantiza que
# IDENTITY() devuelva el id recien generado.
spring.datasource.hikari.maximum-pool-size=1

# Ejecuta schema.sql y data.sql al arrancar
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Campana Black Friday (activa/inactiva)
promo.black-friday.activa=false
